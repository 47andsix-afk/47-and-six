<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>47-&-SIX // Class Menu Portfolio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="nav"></div>

  <main class="page-main">
    <header class="page-header">
      <h1 id="page-title"></h1>
      <p id="page-tagline"></p>
    </header>

    <section class="form-panel story-block" id="story-section"></section>

    <section class="content-section">
      <h2>01 // Class Dishes by Week</h2>
      <div class="menu-columns" id="weeks"></div>
    </section>

    <section class="content-section">
      <h2>02 // Plate Photo Slots</h2>
      <p class="hero-subtext">Replace each placeholder with your real plate photos as you document your class and private-chef work.</p>
      <div class="plate-grid" id="plate-grid"></div>
    </section>

    <section class="content-section">
      <h2>03 // Private Chef Additions</h2>
      <div class="grid-2" id="private-sections"></div>
    </section>
  </main>

  <div id="footer"></div>

  <script>
    fetch('/static/components/nav.html')
      .then(r => r.text())
      .then(html => {
        document.getElementById('nav').innerHTML = html;
        const toggle = document.getElementById('dark-toggle');
        if (toggle) toggle.onclick = () => document.body.classList.toggle('dark');
      })
      .then(() => loadContent())
      .catch(() => loadContent());

    fetch('/static/components/footer.html')
      .then(r => r.text())
      .then(html => document.getElementById('footer').innerHTML = html);
  </script>

  <script>
    const siteDataUrl = '/site_data.json';
    let navLinksEl = document.querySelector('.nav-links');
    const pageTitleEl = document.getElementById('page-title');
    const pageTaglineEl = document.getElementById('page-tagline');
    const storySectionEl = document.getElementById('story-section');
    const weeksEl = document.getElementById('weeks');
    const plateGridEl = document.getElementById('plate-grid');
    const privateSectionsEl = document.getElementById('private-sections');
    const footerSummaryEl = document.getElementById('footer-summary');
    const footerNoteEl = document.getElementById('footer-note');

    function createNode(tag, attrs = {}, content = '') {
      const node = document.createElement(tag);
      Object.entries(attrs).forEach(([key, value]) => {
        if (key === 'class') {
          node.className = value;
        } else if (key === 'href') {
          node.setAttribute('href', value);
        } else {
          node[key] = value;
        }
      });
      if (typeof content === 'string') {
        node.textContent = content;
      } else if (content instanceof Node) {
        node.appendChild(content);
      }
      return node;
    }

    function renderNav(links) {
      navLinksEl = document.querySelector('.nav-links');
      if (!navLinksEl) return;
      navLinksEl.innerHTML = '';
      links.forEach((link) => {
        const anchor = createNode('a', { href: link.href }, link.label);
        navLinksEl.appendChild(anchor);
      });
    }

    function renderStory(story) {
      storySectionEl.innerHTML = '';
      storySectionEl.appendChild(createNode('div', { class: 'card-tag' }, 'Chef Story'));
      storySectionEl.appendChild(createNode('p', {}, story));
    }

    function renderWeeks(weeks) {
      weeksEl.innerHTML = '';
      weeks.forEach((week) => {
        const card = createNode('div', { class: 'card' });
        card.appendChild(createNode('h3', {}, week.title));
        const list = createNode('ul');
        week.items.forEach((item) => list.appendChild(createNode('li', {}, item)));
        card.appendChild(list);
        weeksEl.appendChild(card);
      });
    }

    function renderPlateSlots(slots) {
      plateGridEl.innerHTML = '';
      slots.forEach((slot) => {
        const figure = createNode('figure', { class: 'plate-card' });
        figure.appendChild(createNode('div', { class: 'photo-slot' }, `Drop image: ${slot.photo}`));
        figure.appendChild(createNode('figcaption', {}, slot.caption));
        plateGridEl.appendChild(figure);
      });
    }

    function renderPrivateSections(sections) {
      privateSectionsEl.innerHTML = '';
      sections.forEach((section) => {
        const card = createNode('div', { class: section.tag === 'Externship' ? 'card terminal-card' : 'card' });
        card.appendChild(createNode('div', { class: 'card-tag' }, section.tag));
        card.appendChild(createNode('h3', {}, section.title));
        card.appendChild(createNode('p', {}, section.description));
        privateSectionsEl.appendChild(card);
      });
    }

    async function loadContent() {
      try {
        const response = await fetch(siteDataUrl);
        if (!response.ok) throw new Error(`Failed to load site data: ${response.status}`);
        const data = await response.json();
        renderNav(data.nav_links || []);
        const page = data.class_menu || {};
        pageTitleEl.textContent = page.title || 'Class Menu Portfolio';
        pageTaglineEl.textContent = page.tagline || '';
        renderStory(page.story || '');
        renderWeeks(page.weeks || []);
        renderPlateSlots(page.plate_slots || []);
        renderPrivateSections(page.private_sections || []);
        footerSummaryEl.textContent = page.footer?.summary || '';
        footerNoteEl.textContent = page.footer?.note || '';
      } catch (error) {
        document.body.innerHTML = `<main class="page-main"><section class="content-section"><h2>Could not load page data</h2><p>${error.message}</p></section></main>`;
      }
    }

  </script>
</body>
</html>
