<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>47-&-SIX Admin Login</title>
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Arial, sans-serif; background: #07101c; color: #f4f6fa; }
    .login-shell { width: min(480px, calc(100vw - 40px)); background: rgba(4, 12, 24, 0.95); border: 1px solid rgba(241, 199, 90, 0.16); border-radius: 24px; padding: 32px; box-shadow: 0 24px 60px rgba(0,0,0,0.35); }
    h1 { margin-top: 0; font-size: clamp(2rem, 3vw, 2.6rem); color: #f1c75a; }
    p { color: #b8c1dc; margin-bottom: 24px; }
    input { width: 100%; padding: 14px 16px; border-radius: 14px; border: 1px solid rgba(241,199,90,0.18); background: #08101c; color: #eef2ff; font-size: 1rem; }
    button { width: 100%; margin-top: 16px; border: none; border-radius: 999px; padding: 14px 18px; background: #f1c75a; color: #111; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <div class="login-shell">
    <h1>Admin Login</h1>
    <p>Enter the admin token to manage gallery metadata and updates.</p>
    <input id="token" type="password" placeholder="Enter admin token" />
    <button onclick="login()">Login</button>
  </div>
  <script>
    function login() {
      const token = document.getElementById('token').value.trim();
      if (!token) {
        alert('Please enter the admin token.');
        return;
      }
      localStorage.setItem('admin_token', token);
      window.location.href = '/static/admin/gallery.html';
    }
  </script>
</body>
</html>
