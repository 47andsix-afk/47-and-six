<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>47-&-SIX // Plate Gallery</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #181b21;
      --text: #f4f6fa;
      --muted: #a6afbd;
      --line: #2a2f39;
      --accent: #f6b74a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at 20% 0%, #1d2430, var(--bg));
      color: var(--text);
    }

    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px 20px 40px;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      letter-spacing: 1px;
      font-size: clamp(1.4rem, 2.3vw, 2rem);
    }

    .sub {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .back {
      text-decoration: none;
      color: #111;
      background: var(--accent);
      border: 1px solid #00000033;
      border-radius: 999px;
      padding: 8px 14px;
      font-weight: 700;
      white-space: nowrap;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 18px;
      align-items: center;
    }

    .filters input,
    .filters select {
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      padding: 10px 12px;
      font-size: 0.95rem;
      min-width: 220px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 14px;
    }

    figure {
      margin: 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    figure:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      display: block;
      background: #0b0d12;
    }

    figcaption {
      padding: 12px;
      color: var(--muted);
      font-size: 0.92rem;
      border-top: 1px solid var(--line);
      line-height: 1.4;
    }

    figcaption strong {
      color: var(--text);
      display: block;
      margin-bottom: 6px;
    }

    .category-wrapper {
      margin-bottom: 36px;
    }

    .category-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .category-header h2 {
      margin: 0;
      font-size: 1.1rem;
    }

    .category-header p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
      max-width: 680px;
    }

    .empty-state {
      color: var(--muted);
      padding: 24px 0;
      text-align: center;
    }

    @media (max-width: 540px) {
      img {
        height: 200px;
      }

      .filters {
        flex-direction: column;
        align-items: stretch;
      }
    }
  </style>
</head>
<body>
  <div id="nav"></div>
  <main class="wrap">
    <div class="top">
      <div>
        <h1>PLATE GALLERY</h1>
        <p class="sub">Organized culinary photography, chef portfolio plates, AI art, and behind-the-scenes captures.</p>
      </div>
      <a class="back" href="index.html">Back To Home</a>
    </div>

    <div class="filters">
      <input id="search" type="search" placeholder="Search plates, tags, or descriptions" />
      <select id="category-filter">
        <option value="all">All categories</option>
      </select>
    </div>

    <div id="loading" class="empty-state">Loading…</div>
    <div id="gallery"></div>
  </main>

  <script>
    const galleryEl = document.getElementById('gallery');
    const loadingEl = document.getElementById('loading');
    const searchEl = document.getElementById('search');
    const categoryFilterEl = document.getElementById('category-filter');
    let galleryData = null;

    function normalize(text) {
      return String(text || '').toLowerCase();
    }

    function renderCategory(category, items) {
      const section = document.createElement('section');
      section.className = 'category-wrapper';

      const header = document.createElement('div');
      header.className = 'category-header';
      header.innerHTML = `
        <div>
          <h2>${category.title}</h2>
          <p>${category.description}</p>
        </div>
      `;
      section.appendChild(header);

      if (!items.length) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.textContent = 'No plates match your current search or filter.';
        section.appendChild(empty);
        return section;
      }

      const grid = document.createElement('div');
      grid.className = 'grid';
      items.forEach((item) => {
        const figure = document.createElement('figure');
        const image = document.createElement('img');
        image.src = item.src;
        image.alt = item.alt || item.title;
        image.loading = 'lazy';
        image.onerror = () => {
          image.src = '/static/fallback.jpg';
        };
        figure.appendChild(image);

        const caption = document.createElement('figcaption');
        caption.innerHTML = `
          <strong>${item.title}</strong>
          ${item.description}
        `;
        figure.appendChild(caption);
        grid.appendChild(figure);
      });
      section.appendChild(grid);
      return section;
    }

    function filterGallery() {
      if (!galleryData) {
        return;
      }
      const searchTerm = normalize(searchEl.value);
      const selectedCategory = categoryFilterEl.value;
      galleryEl.innerHTML = '';

      galleryData.categories.forEach((category) => {
        if (selectedCategory !== 'all' && selectedCategory !== category.id) {
          return;
        }

        const filteredItems = category.items.filter((item) => {
          if (!searchTerm) return true;
          return [item.title, item.alt, item.description, ...(item.tags || [])]
            .some((value) => normalize(value).includes(searchTerm));
        });

        const section = renderCategory(category, filteredItems);
        galleryEl.appendChild(section);
      });
    }

    async function loadGallery() {
      loadingEl.style.display = 'block';
      galleryEl.innerHTML = '';
      try {
        const response = await fetch('/gallery');
        if (!response.ok) {
          galleryEl.innerHTML = '<p class="empty-state">Unable to load gallery data.</p>';
          return;
        }
        galleryData = await response.json();
        const categories = galleryData.categories || [];
        categories.forEach((category) => {
          const option = document.createElement('option');
          option.value = category.id;
          option.textContent = category.title;
          categoryFilterEl.appendChild(option);
        });
        filterGallery();
      } catch (error) {
        galleryEl.innerHTML = `<p class="empty-state">Gallery load error: ${error.message}</p>`;
      } finally {
        loadingEl.style.display = 'none';
      }
    }

    searchEl.addEventListener('input', filterGallery);
    categoryFilterEl.addEventListener('change', filterGallery);
    loadGallery();
  </script>

  <div id="footer"></div>
  <script>
    fetch('/static/components/nav.html')
      .then(r => r.text())
      .then(html => {
        document.getElementById('nav').innerHTML = html;
        const toggle = document.getElementById('dark-toggle');
        if (toggle) toggle.onclick = () => document.body.classList.toggle('dark');
      });

    fetch('/static/components/footer.html')
      .then(r => r.text())
      .then(html => document.getElementById('footer').innerHTML = html);
  </script>
</body>
</html>
