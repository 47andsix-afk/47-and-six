<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>47-&-SIX // Culinary Architecture</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="/static/favicon.ico">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="description" content="47-SIX Culinary Architecture — AI-powered chef intelligence suite.">
  <meta name="keywords" content="chef, culinary, AI, menu, workflow, kitchen ops">
  <meta property="og:title" content="47-SIX Culinary Architecture">
  <meta property="og:type" content="website">
  <meta property="og:url" content="http://127.0.0.1/">
  <meta property="og:image" content="/static/fallback.jpg">
</head>
<body>
  <div id="nav"></div>

  <main class="page-main">
    <section id="hero" class="hero-section"></section>
    <div id="site-sections"></div>
  </main>

  <div id="footer"></div>

  <script>
    fetch('/static/components/nav.html')
      .then(r => r.text())
      .then(html => {
        document.getElementById('nav').innerHTML = html;
        const toggle = document.getElementById('dark-toggle');
        if (toggle) toggle.onclick = () => document.body.classList.toggle('dark');
      })
      .then(() => loadSiteData())
      .catch(() => loadSiteData());

    fetch('/static/components/footer.html')
      .then(r => r.text())
      .then(html => document.getElementById('footer').innerHTML = html);
  </script>

  <script>
    const siteDataUrl = '/site_data.json';
    let navLinksEl = document.querySelector('.nav-links');
    const heroEl = document.getElementById('hero');
    const sectionsContainer = document.getElementById('site-sections');

    function createNode(tag, attrs = {}, content = '') {
      const node = document.createElement(tag);
      Object.entries(attrs).forEach(([key, value]) => {
        if (key === 'class') {
          node.className = value;
        } else if (key === 'href') {
          node.setAttribute('href', value);
        } else if (key === 'src') {
          node.setAttribute('src', value);
        } else if (key === 'alt') {
          node.setAttribute('alt', value);
        } else {
          node[key] = value;
        }
      });
      if (typeof content === 'string') {
        node.textContent = content;
      } else if (content instanceof Node) {
        node.appendChild(content);
      }
      return node;
    }

    function renderNav(links) {
      navLinksEl = document.querySelector('.nav-links');
      if (!navLinksEl) return;
      navLinksEl.innerHTML = '';
      links.forEach((link) => {
        const anchor = createNode('a', { href: link.href }, link.label);
        navLinksEl.appendChild(anchor);
      });
    }

    function renderHero(hero) {
      heroEl.innerHTML = '';
      const content = createNode('div', { class: 'hero-content' });
      content.appendChild(createNode('div', { class: 'status-badge' }, hero.status));
      content.appendChild(createNode('h1', {}, hero.title));
      content.appendChild(createNode('p', { class: 'hero-subtext' }, hero.subtext));
      heroEl.appendChild(content);
    }

    function createButtonLink(card) {
      if (!card.link_text || !card.link_href) return null;
      const link = createNode('a', { class: 'card-link', href: card.link_href }, card.link_text);
      return link;
    }

    function renderCard(card) {
      const container = createNode('div', { class: 'card' });
      if (card.img_src) {
        const img = createNode('img', { src: card.img_src, alt: card.img_alt || card.title });
        container.appendChild(img);
      }
      if (card.tag) {
        container.appendChild(createNode('div', { class: 'card-tag' }, card.tag));
      }
      container.appendChild(createNode('h3', {}, card.title));
      container.appendChild(createNode('p', {}, card.description));
      const link = createButtonLink(card);
      if (link) container.appendChild(link);
      return container;
    }

    function renderSection(section) {
      const sectionEl = createNode('section', { class: 'content-section', id: section.id });
      sectionEl.appendChild(createNode('h2', {}, section.title));
      if (section.intro) {
        const intro = createNode('p', { class: 'hero-subtext' }, section.intro);
        sectionEl.appendChild(intro);
      }

      if (section.type === 'featured' && section.cards?.length) {
        const cardData = section.cards[0];
        const card = createNode('div', { class: 'card terminal-card' });
        if (card.tag) card.appendChild(createNode('div', { class: 'card-tag' }, card.tag));
        card.appendChild(createNode('h3', {}, card.title));
        card.appendChild(createNode('p', {}, card.description));
        if (card.progress_label) {
          const progress = createNode('div', { class: 'progress-container' });
          progress.appendChild(createNode('div', { class: 'progress-label' }, card.progress_label));
          const barBg = createNode('div', { class: 'progress-bar-bg' });
          const bar = createNode('div', { class: 'progress-bar' });
          if (typeof card.progress_value === 'number') {
            bar.style.width = `${Math.min(100, Math.max(0, card.progress_value))}%`;
          }
          barBg.appendChild(bar);
          progress.appendChild(barBg);
          card.appendChild(progress);
        }
        sectionEl.appendChild(card);
        return sectionEl;
      }

      const grid = createNode('div', { class: section.type || 'grid-3' });
      (section.cards || []).forEach((card) => grid.appendChild(renderCard(card)));
      sectionEl.appendChild(grid);
      return sectionEl;
    }

    async function loadSiteData() {
      try {
        const response = await fetch(siteDataUrl);
        if (!response.ok) {
          throw new Error(`Failed to load site data: ${response.status}`);
        }
        const data = await response.json();
        renderNav(data.nav_links || []);
        renderHero(data.index.hero || {});
        sectionsContainer.innerHTML = '';
        (data.index.sections || []).forEach((section) => {
          sectionsContainer.appendChild(renderSection(section));
        });
      } catch (error) {
        document.body.innerHTML = `<main class="page-main"><section class="content-section"><h2>Site data load failed</h2><p>${error.message}</p></section></main>`;
      }
    }

  </script>
</body>
</html>
