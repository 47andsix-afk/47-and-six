<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>47-&-SIX // Portfolio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="nav"></div>
  <main class="page-main">
    <section class="content-section">
      <h1>Chef Portfolio</h1>
      <p>A selection of culinary projects and event work illustrating menu design, execution, and hospitality craft.</p>
      <div id="portfolio-container" class="portfolio-grid"></div>
    </section>
  </main>
  <div id="footer"></div>

  <script>
    fetch('/static/components/nav.html')
      .then(r => r.text())
      .then(html => {
        document.getElementById('nav').innerHTML = html;
        const toggle = document.getElementById('dark-toggle');
        if (toggle) toggle.onclick = () => document.body.classList.toggle('dark');
      });

    fetch('/static/components/footer.html')
      .then(r => r.text())
      .then(html => document.getElementById('footer').innerHTML = html);
  </script>

  <script>
    fetch('/portfolio')
      .then(r => r.json())
      .then(items => {
        const container = document.getElementById('portfolio-container');
        if (!items.length) {
          container.innerHTML = '<p>No portfolio items available.</p>';
          return;
        }
        items.forEach(p => {
          const card = document.createElement('div');
          card.className = 'portfolio-card';
          card.innerHTML = `
            <img src="${p.image}" alt="${p.project}" loading="lazy">
            <h3>${p.project}</h3>
            <p>${p.role} — ${p.date}</p>
            <p>${p.notes}</p>
          `;
          container.appendChild(card);
        });
      })
      .catch(() => {
        document.getElementById('portfolio-container').innerHTML = '<p>Error loading portfolio.</p>';
      });
  </script>
</body>
</html>
